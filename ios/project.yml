# XcodeGen spec. The .xcodeproj is generated on the CI runner:  cd ios && xcodegen generate
name: WW2BattleOdds
options:
  bundleIdPrefix: com.jbmullican
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"   # CI overrides this with the GitHub run number
targets:
  WW2BattleOdds:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WW2BattleOdds/Sources
      - path: WW2BattleOdds/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: WW2BattleOdds
        PRODUCT_BUNDLE_IDENTIFIER: com.jbmullican.ww2battleodds
        INFOPLIST_FILE: WW2BattleOdds/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO    # the copy script reads web files from the repo root
        ENABLE_BITCODE: NO
    postBuildScripts:
      - name: Copy bundled web app
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        script: |
          "${SRCROOT}/scripts/copy_web_assets.sh"
    scheme: {}
