name: iOS TestFlight

# Security notes:
# - Uploading to TestFlight only happens when the owner starts this workflow by hand
#   (Actions > iOS TestFlight > Run workflow) AND approves the "testflight" environment.
# - Signing secrets live only in that protected environment, which only the main branch can use.
# - Pushes run only the tests and the unsigned compile check, which use no secrets.
# - Every third-party action is pinned to a full commit SHA.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - index.html
      - manifest.webmanifest
      - css/**
      - js/**
      - icons/**
      - ios/**
      - .github/workflows/ios-testflight.yml

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  web-tests:
    name: Engine tests (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node tests/engine.test.js

  ios-compile:
    name: iOS compile check (unsigned)
    runs-on: xcode-27            # macOS 27 image with Xcode 27 (GitHub public preview)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '27.0'   # newest non-beta Xcode on GitHub runners
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build for device without signing
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild build \
            -project ios/WW2BattleOdds.xcodeproj \
            -scheme WW2BattleOdds \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/WW2BattleOdds.app"
          test -f "$APP/web/index.html" || { echo "::error::Bundled web app missing from $APP/web"; exit 1; }
          test -f "$APP/web/js/worker.js" || { echo "::error::worker.js missing from bundle"; exit 1; }
          ls -R "$APP/web"

  testflight:
    name: Archive and upload to TestFlight
    needs: [web-tests, ios-compile]
    # Only a manual run on main by the repo owner, in this repo (never a fork), can upload.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'jbmullican/ww2-battle-odds' &&
      github.actor == 'jbmullican'
    environment: testflight
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check required secrets
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ]    || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ]    || missing="$missing ASC_KEY_P8"
          [ -n "$APPLE_TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::Add these secrets to the testflight environment (Settings > Environments > testflight):$missing"
            exit 1
          fi
          echo "All four secrets are present."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '27.0'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Write App Store Connect API key
        run: |
          umask 077
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "::error::ASC_KEY_P8 does not look like a .p8 key. Paste the whole file, including the BEGIN/END PRIVATE KEY lines."
            exit 1
          fi
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # The archive is built unsigned. Signing happens in the export step, which uses the
      # App Store Connect API key to get an Apple Distribution certificate and an App Store
      # profile from Apple (cloud signing). This avoids needing a registered test device,
      # which development-signed archives require.
      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild archive \
            -project ios/WW2BattleOdds.xcodeproj \
            -scheme WW2BattleOdds \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/WW2BattleOdds.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=1.0 \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export and upload to App Store Connect
        run: |
          set -o pipefail
          cp ios/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          plutil -replace teamID -string "$APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/WW2BattleOdds.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded WW2 Battle Odds 1.0 ($BUILD_NUMBER). It appears in TestFlight after Apple finishes processing (usually 5-30 minutes)."

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
